e d# This is the resource bundle for zelectr

#Texts for manifest.json

#XTIT: Application name
appTitle=Electricity counter

#YDES: Application description
appDescription=Electricity counter formula validation prototype

#XTIT: Main view title
title=Electricity counter - formula validation

# Filter / header section
filterHeader=Selection
plant=Plant
position=Position
positionPlaceholder=e.g. bE31X
month=Month (pick any date in the month)
manualFilter=Manual entry filter
manualAll=All
manualAutomatic=Automatic
manualManual=Manual
strategy=P() resolution strategy
strategyHint=All P(position) resolution strategies are PROVISIONAL: the exact ABAP semantics of P(position) are not yet confirmed (PAST_MEASUREMENT is not exposed by the OData service). Numeric results are never authoritative.
load=Load

# Formula section
formulaHeader=Position and formula
parserOk=Entire formula parsed successfully by the independent JavaScript parser.
formulaChanged=Formula changes during the selected month
formulaStable=Formula constant during the selected month

# KPI strip
kpiHeader=Monthly overview
monthlySummary=Monthly aggregate
kpiRows=Parent rows
kpiSupported=Parser-supported rows
kpiUnsupported=Unsupported formulas
kpiMissingRefs=Rows with missing references
kpiCalculated=Calculated rows (provisional)
kpiDifferences=Rows with differences

# Tables
resultsHeader=Monthly results (one row per parent record)
resultsHint=Select a row to inspect the reference breakdown below. Stored adjusted quantity is the authoritative comparison target; suggested quantity is reference only.
colDate=Date
colManual=Manual
colStoredAdjusted=Stored adjusted
colStoredSuggested=Stored suggested
colBackendComputed=Backend computed
colJsValue=JS value (provisional)
colDifference=Difference (JS - adjusted)
colComparison=Parser comparison
colStatus=Status
colSeq=Seq
colSign=Sign
colRefPosition=Reference position
colMultiplier=Multiplier
colDivisor=Divisor
colParseNote=Parse note
colSourceDate=Source date
colSourceManual=Source manual
colRefAdjusted=Ref adjusted
colRefSuggested=Ref suggested
colBackendRefAdjusted=Backend ref adjusted
colBackendContribution=Backend contribution
colJsContribution=JS contribution
colRefStatus=RefStatus
colRule=Resolution rule / reason
colBackendSign=BE sign
colBackendRef=BE reference
colBackendMultiplier=BE multiplier
colBackendDivisor=BE divisor
colComponentMatch=Component match

detailHeader=Reference breakdown for the selected date
detailFor=Reference breakdown for
parseHeader=JavaScript parser output
parseFor=JS parse for
parseNotSupported=The formula of the selected row is not supported by the JavaScript parser - no terms available
backendHeader=Backend parser components and structural comparison
comparisonFor=JS vs backend components for

# Monthly totals
totalsLabel=Monthly totals (sum of the displayed daily values)
totalsNote=Provisional - a simple sum of the displayed daily values is NOT a confirmed monthly aggregate: the P() period rule is unconfirmed. If P() turns out to be cumulative readings, the month total is the period-end value, not this sum.

# Column tooltips
ttStoredAdjusted=StoredAdjustedQuantity from Z_C_ELECR_VALIDATE - the authoritative stored value for validation.
ttStoredSuggested=StoredSuggestedQuantity from Z_C_ELECR_VALIDATE - reference/display only, never the comparison target.
ttBackendComputed=ComputedQuantity from Z_C_ELECR_VALIDATE - the quantity the backend calculated for this row, shown separately from the JavaScript result.
ttJsValue=Quantity calculated by the independent JavaScript parser using the selected provisional P() resolution strategy. Empty when the formula is unsupported or references are missing/ambiguous.
ttDifference=JS value minus StoredAdjustedQuantity, computed exactly without any tolerance. Empty when no JS value is available.
ttComparison=Structural comparison of the JavaScript parse against the backend component table Z_C_ELECR_VALIDATE_REF, per occurrence (sign, reference, multiplier, divisor) - not a comparison of totals.
ttStatus=Calculation status: PROVISIONAL (calculated with an unconfirmed P() rule), INCOMPLETE DATA (missing references), AMBIGUOUS SOURCE, UOM MISMATCH, UNSUPPORTED or NOT CALCULATED.

# Status / misc texts
manualYes=Manual
manualNo=Automatic
cmpMatch=Match
cmpDiffers=Differs
cmpExtra=Extra in backend
cmpMissing=Missing in backend
noResults=No parent rows for this selection
noDetail=No reference breakdown available for this row
noParse=No JavaScript parse terms available
noBackend=No backend component rows available

# Messages
msgMissingInput=Please provide plant, position and month before loading.
msgLoadError=Data loading failed
msgNoData=No data found for this selection in Z_C_ELECR_VALIDATE or Z_I_ELECR_CNTR. Check plant, position and month.
fallbackNote=No record found in Z_C_ELECR_VALIDATE for this selection - showing source rows from Z_I_ELECR_CNTR instead. The stored quantity columns contain source quantities and backend ComputedQuantity is unavailable.
fallbackCase=Position was matched case-insensitively (Pos has display format UpperCase).
